[package]
name = "track-topia"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["alloc"] }
clap = { version = "4.5.46", features = ["derive"] }
config = "0.15.25"
directories = "6.0.0"
